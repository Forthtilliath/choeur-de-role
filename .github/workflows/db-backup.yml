name: DB Backup

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: PostgreSQL → Cloudflare R2
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get install -y curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

      - name: Set backup metadata
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "BACKUP_TYPE=migration" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "BACKUP_TYPE=daily" >> $GITHUB_ENV
          else
            echo "BACKUP_TYPE=manual" >> $GITHUB_ENV
          fi
          echo "DATE=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV

      - name: Create backup
        env:
          DB_BACKUP_URL: ${{ secrets.DB_BACKUP_URL }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          DB_URL="$(echo -n "$DB_BACKUP_URL" | tr -d '[:space:]')"
          pg_dump -d "$DB_URL" \
            --schema=public --no-owner --no-acl \
            -f "backup_public_${DATE}.sql"
          gzip "backup_public_${DATE}.sql"

          pg_dump -d "$DB_URL" \
            --table=auth.users \
            --table=auth.identities \
            --data-only --no-owner --no-acl \
            -f "backup_auth_${DATE}.sql"
          gzip "backup_auth_${DATE}.sql"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          aws s3 cp "backup_public_${DATE}.sql.gz" \
            "s3://cda-backups/${BACKUP_TYPE}/${DATE}/backup_public.sql.gz" \
            --endpoint-url "$R2_ENDPOINT"

          aws s3 cp "backup_auth_${DATE}.sql.gz" \
            "s3://cda-backups/${BACKUP_TYPE}/${DATE}/backup_auth.sql.gz" \
            --endpoint-url "$R2_ENDPOINT"

          echo "✓ Backup ${BACKUP_TYPE} uploaded: ${DATE}"
