name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest

    env:
      AUTH_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Supabase local : port fixe (supabase/config.toml). On utilise `localhost` plutôt
      # que l'IP renvoyée par `supabase status` — z.url() (src/env.ts) rejette 127.0.0.1.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      # Valeurs factices : non utilisées par les pages publiques mesurées par Lighthouse,
      # mais requises par la validation env (src/env.ts).
      AUTH_SECRET: ci-lighthouse-not-a-real-session-secret
      RESEND_API_KEY: re_ci_placeholder
      NEXT_MAIL_CONTACT: ci@example.com
      YOUTUBE_API_KEY: ci_placeholder
      # R2 : vraies valeurs (images de la galerie / médias du répertoire).
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
      CLOUDFLARE_R2_IMAGES_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_IMAGES_BUCKET_NAME }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Mettre à jour npm
        run: npm install -g npm@11

      - name: Installer les dépendances
        run: npm ci

      - name: Démarrer Supabase local
        run: supabase start

      - name: Exposer les clés Supabase locales
        run: |
          supabase status -o env \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            >> "$GITHUB_ENV"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build Next.js
        run: npm run build

      - name: Démarrer le serveur
        run: npm start &

      - name: Attendre que le serveur soit prêt
        run: npx wait-on@latest http://localhost:3000 --timeout 30000

      - name: Lancer Lighthouse CI
        run: npx @lhci/cli@latest autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
