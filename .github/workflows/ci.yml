name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: TypeScript · ESLint · Tests unitaires
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Mettre à jour npm
        run: npm install -g npm@11

      - name: Installer les dépendances
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Tests unitaires (Vitest)
        run: npm test
        env:
          SKIP_ENV_VALIDATION: 'true'
