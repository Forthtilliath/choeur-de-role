<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Chœur de Rôle">
  <defs>
    <radialGradient id="disc" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#8a5fe0"/>
      <stop offset="0.55" stop-color="#5e32b2"/>
      <stop offset="1" stop-color="#2e1363"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7dc8f"/>
      <stop offset="0.45" stop-color="#e6ac3d"/>
      <stop offset="1" stop-color="#8a5600"/>
    </linearGradient>
    <linearGradient id="goldNote" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dc8f"/>
      <stop offset="1" stop-color="#e6ac3d"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#eadfca"/>
    </linearGradient>
    <clipPath id="inner">
      <circle cx="256" cy="256" r="207"/>
    </clipPath>
  </defs>

  <!-- Jeton : anneau doré, tranche sombre, disque violet -->
  <circle cx="256" cy="256" r="252" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="230" fill="#2a1152"/>
  <circle cx="256" cy="256" r="222" fill="url(#disc)"/>

  <!-- Portée -->
  <g clip-path="url(#inner)" stroke="#fffdf7" stroke-opacity="0.22" stroke-width="3">
    <line x1="0" y1="98" x2="512" y2="98"/>
    <line x1="0" y1="122" x2="512" y2="122"/>
    <line x1="0" y1="146" x2="512" y2="146"/>
    <line x1="0" y1="170" x2="512" y2="170"/>
    <line x1="0" y1="194" x2="512" y2="194"/>
  </g>

  <!-- Liseré intérieur, comme le cadre d'une carte -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="#e6ac3d" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Deux croches liées, posées sur la portée -->
  <g fill="url(#goldNote)">
    <ellipse cx="206" cy="182" rx="22" ry="15.5" transform="rotate(-22 206 182)"/>
    <ellipse cx="294" cy="158" rx="22" ry="15.5" transform="rotate(-22 294 158)"/>
    <rect x="219" y="96" width="8" height="84" rx="2"/>
    <rect x="307" y="72" width="8" height="84" rx="2"/>
    <polygon points="219,96 315,72 315,94 219,118"/>
  </g>

  <!-- La reine -->
  <g fill="url(#ivory)">
    <path d="M214 322 L200 252 L218 284 L229 240 L243 278 L256 228 L269 278 L283 240 L294 284 L312 252 L298 322 Z"/>
    <circle cx="200" cy="246" r="9"/>
    <circle cx="229" cy="234" r="8.5"/>
    <circle cx="256" cy="220" r="11"/>
    <circle cx="283" cy="234" r="8.5"/>
    <circle cx="312" cy="246" r="9"/>
    <rect x="212" y="318" width="88" height="14" rx="7"/>
    <path d="M224 332 L288 332 C 290 356, 300 378, 316 396 L196 396 C 212 378, 222 356, 224 332 Z"/>
    <rect x="184" y="394" width="144" height="18" rx="7"/>
    <rect x="170" y="410" width="172" height="22" rx="9"/>
  </g>
</svg>
